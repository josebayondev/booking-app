[project]
name = "booking-app-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic-settings>=2.15",
    "psycopg[binary]>=3.3",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
