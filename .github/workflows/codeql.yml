# Análisis estático (SAST) del código Python con CodeQL, publicando en la pestaña
# Security del repositorio.
#
# Configuración *avanzada* -- un fichero de workflow -- y no la configuración por
# defecto de un clic que vive en los ajustes del repositorio. Esa por defecto vive en
# la configuración del repo, así que no viaja: una app generada desde esta plantilla
# empezaría su vida sin ningún análisis estático y sin enterarse. Este fichero se
# versiona, se revisa y se hereda. Mismo razonamiento que usar la CLI de gitleaks en
# vez de gitleaks-action en secret-scan.yml. No actives también la configuración por
# defecto: las dos entran en conflicto.
name: CodeQL

on:
  pull_request:
    branches: [main]
  # Analizar también main da a las alertas una línea base contra la que comparar un
  # PR, que es lo que permite a GitHub distinguir un problema recién introducido de
  # uno que ya estaba.
  push:
    branches: [main]
  # CodeQL publica consultas nuevas continuamente, así que código que estaba limpio
  # el día que se mergeó puede resultar vulnerable meses después. Nada más en este
  # repo vuelve a examinar código que ya aterrizó.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Necesario para publicar los hallazgos en la pestaña Security del repositorio.
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript se une a esta lista el día que aterrice el andamiaje
        # del frontend. No se puede añadir por adelantado: CodeQL tumba la ejecución
        # entera cuando un lenguaje configurado no tiene ficheros que extraer.
        language: [python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin paso de autobuild y sin instalar dependencias: Python se analiza
      # directamente desde el código fuente y CodeQL resuelve solo lo que necesita.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyse
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"
