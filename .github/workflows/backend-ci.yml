# CI del backend: lint, tipos, migraciones, tests, build de la imagen y auditoría de
# dependencias. Los jobs van encadenados, así que un fallo temprano ahorra el resto.
name: Backend CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect backend changes
        id: filter
        run: |
          # Este propio fichero cuenta como cambio de backend a propósito: sin eso,
          # un PR que solo toque la CI se saltaría todos los jobs, y una pipeline
          # rota pasaría desapercibida hasta el siguiente PR que tocase backend/.
          if git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | grep -qE '^backend/|^\.github/workflows/backend-ci\.yml'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  ruff:
    name: ruff
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff
        run: uv run ruff check .

  mypy:
    name: mypy
    needs: ruff
    if: needs.ruff.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run mypy
        run: uv run mypy app

  # Vigila el hueco entre modelos y migraciones: sin esto, añadir un modelo o una
  # columna y olvidarse de generar la migración pasa la CI, se despliega en Render
  # y solo falla en producción contra una tabla que no existe.
  migrations:
    name: migrations
    needs: mypy
    if: needs.mypy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # Sin --extra dev: alembic es dependencia de runtime y este job no tiene nada
      # que hacer con ruff, mypy o pytest.
      - name: Install dependencies
        run: uv sync --frozen

      # Reproduce todas las migraciones sobre una base de datos vacía, así que una
      # rota se caza aquí y no cuando migrate-production.yml llegue a Neon.
      - name: Apply migrations from an empty database
        run: uv run alembic upgrade head

      # Compara Base.metadata contra el esquema que acaban de construir las migraciones.
      - name: Fail if models drifted from migrations
        run: uv run alembic check

  pytest:
    name: pytest
    needs: migrations
    if: needs.migrations.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # No es redundante con el job de migraciones: los jobs no comparten contenedores
      # de servicio, así que el esquema de aquel murió con él y este empieza con una base
      # de datos vacía. Los tests marcados con db necesitan las tablas de verdad, y
      # construirlas desde las migraciones en vez de con Base.metadata.create_all()
      # significa que la suite corre contra el esquema que tendrá producción -- una
      # migración que se desvíe de los modelos falla aquí además de en `alembic check`.
      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run pytest
        run: uv run pytest

  docker-build:
    name: docker-build
    needs: pytest
    if: needs.pytest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t booking-backend:ci .

  # Comprueba las dependencias bloqueadas contra la base de avisos de PyPI. Dependabot
  # (.github/dependabot.yml) propone actualizaciones cada semana con 7 días de espera;
  # este job es lo que impide que un aviso se ignore mientras esa cadencia va llegando.
  #
  # Corre el último a propósito: puede publicarse un CVE nuevo contra un lockfile que
  # nadie ha tocado, así que este job puede ponerse en rojo por motivos que no tienen
  # nada que ver con el PR. Ponerlo detrás del resto hace que eso no retrase nunca el
  # feedback de lint o de tests.
  pip-audit:
    name: pip-audit
    needs: docker-build
    if: needs.docker-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # --extra dev a propósito. Las herramientas de desarrollo no llegan nunca a la
      # imagen, pero sí se ejecutan aquí en CI, así que una comprometida sigue importando.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Audit dependencies
        run: uv run pip-audit --progress-spinner off
