# CI del frontend: lint, tipos, build y auditoría de npm. Hoy está dormida -- todos los
# jobs cuelgan del guard `changes`, que sigue en false mientras no exista
# frontend/package.json.
name: Frontend CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect frontend changes
        id: filter
        run: |
          # Dos condiciones, y hacen falta las dos.
          #
          # 1. package.json tiene que existir. frontend/ sigue siendo un hueco vacío,
          #    así que npm ci y npm run lint no tienen con qué trabajar y el job
          #    falla en setup-node antes de ejecutar nada. Este guard desaparece
          #    solo en cuanto aterrice el andamiaje.
          # 2. Este propio fichero cuenta como cambio de frontend a propósito: si no,
          #    un PR que solo toque la CI se saltaría todos los jobs, y una pipeline
          #    rota pasaría desapercibida hasta el siguiente PR que tocase frontend/.
          if [ -f frontend/package.json ] && git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | grep -qE '^frontend/|^\.github/workflows/frontend-ci\.yml'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    name: typecheck
    needs: lint
    if: needs.lint.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  build:
    name: build
    needs: typecheck
    if: needs.typecheck.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  # La mitad npm del escaneo de dependencias. Hoy dormido: como todos los jobs de
  # aquí, cuelga del guard `changes`, que sigue en false mientras no exista
  # frontend/package.json, así que empieza a correr solo el día que aterrice el
  # andamiaje.
  #
  # --audit-level=high mantiene la barrera en lo que es realmente accionable; el
  # ecosistema npm produce un goteo constante de avisos bajos/moderados en
  # herramientas que solo se usan en desarrollo. Si aun así llega a hacer ruido,
  # --omit=dev es la siguiente palanca.
  audit:
    name: audit
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Sin npm ci: npm audit resuelve directamente desde package-lock.json, así que
      # instalar node_modules antes solo haría el job más lento.
      - name: Audit dependencies
        run: npm audit --audit-level=high
