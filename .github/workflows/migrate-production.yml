name: Migrate production database

# Render's pre-deploy command is a paid feature, so migrations run here instead.
# Applying them from CI keeps them out of application startup, which would race
# between instances and is ruled out by CLAUDE.md.
on:
  push:
    branches: [main]
    paths:
      - "backend/alembic/**"
      # The seed too, because the job runs it and it lives outside alembic/. What needs
      # this path is *adding* a default -- a second appointment type, a Saturday block:
      # rows that do not exist yet by natural key, which the seed inserts.
      #
      # Editing an existing default is a different matter and this path does not help
      # there: seed_defaults() never updates a row that is already present, so changing
      # 30 to 45 in app/seed.py leaves production on 30 whether this workflow fires or
      # not. That is deliberate -- see the docstring. Changing a live value is an UPDATE,
      # or the admin panel once it exists, not an edit to the defaults.
      - "backend/app/seed.py"
      - ".github/workflows/migrate-production.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two migrations at once, and never cancel one halfway through: an
# interrupted upgrade can leave alembic_version out of step with the schema.
concurrency:
  group: migrate-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  migrate:
    name: alembic upgrade head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # No --extra dev: alembic is a runtime dependency, and this job has no
      # business installing ruff, mypy or pytest.
      - name: Install dependencies
        run: uv sync --frozen

      # A repository generated from this template has no such secret, and its very
      # first commit touches backend/alembic/**, so this workflow fires and alembic
      # dies with "Could not parse SQLAlchemy URL from given URL string". There is
      # nothing to migrate without a database: say so and finish green.
      #
      # The check lives in a step rather than in the job's `if:` because the secrets
      # context is not available at job level.
      - name: Check for the production database secret
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL_PRODUCTION is not set, skipping migrations."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show pending migrations
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          echo "Current revision in production:"
          uv run alembic current
          echo "Target revision in this commit:"
          uv run alembic heads

      - name: Apply migrations
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: uv run alembic upgrade head

      # Runs on every push that gets this far, which is safe: seed_defaults() inserts
      # only the default rows that are missing and never touches one that already
      # exists, so a duration edited from the admin panel survives a redeploy.
      #
      # It belongs here rather than in a manual step because a database that migrated
      # but was never seeded answers GET /availability with an empty calendar -- which
      # looks like a booked-solid professional, not like a broken deploy.
      - name: Seed default configuration
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: uv run python -m app.seed
