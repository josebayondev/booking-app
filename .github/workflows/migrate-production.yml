# Aplica las migraciones (y el seed) contra la base de datos de producción.
#
# El comando pre-deploy de Render es una funcionalidad de pago, así que las migraciones
# corren aquí en su lugar. Aplicarlas desde CI las mantiene fuera del arranque de la
# aplicación, donde competirían entre instancias y que además CLAUDE.md descarta.
name: Migrate production database

on:
  push:
    branches: [main]
    paths:
      - "backend/alembic/**"
      # El seed también, porque el job lo ejecuta y vive fuera de alembic/. Lo que
      # necesita esta ruta es *añadir* un valor por defecto -- un segundo tipo de cita,
      # un bloque de sábado: filas que todavía no existen por clave natural y que el
      # seed inserta.
      #
      # Editar un valor por defecto ya existente es otra cosa y esta ruta no ayuda ahí:
      # seed_defaults() no actualiza nunca una fila que ya está, así que cambiar 30 por
      # 45 en app/seed.py deja producción en 30 se dispare o no este workflow. Es
      # deliberado -- ver el docstring. Cambiar un valor vivo es un UPDATE, o el panel
      # de administración cuando exista, no una edición de los valores por defecto.
      - "backend/app/seed.py"
      - ".github/workflows/migrate-production.yml"
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos migraciones a la vez, y nunca cancelar una a medias: un upgrade
# interrumpido puede dejar alembic_version desacompasado respecto al esquema.
concurrency:
  group: migrate-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  migrate:
    name: alembic upgrade head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # Sin --extra dev: alembic es dependencia de runtime, y este job no tiene nada
      # que hacer instalando ruff, mypy o pytest.
      - name: Install dependencies
        run: uv sync --frozen

      # Un repositorio generado desde esta plantilla no tiene ese secreto, y su primer
      # commit ya toca backend/alembic/**, así que este workflow se dispara y alembic
      # muere con "Could not parse SQLAlchemy URL from given URL string". Sin base de
      # datos no hay nada que migrar: decirlo y terminar en verde.
      #
      # La comprobación vive en un paso y no en el `if:` del job porque el contexto
      # `secrets` no está disponible a nivel de job.
      - name: Check for the production database secret
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL_PRODUCTION is not set, skipping migrations."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show pending migrations
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          echo "Current revision in production:"
          uv run alembic current
          echo "Target revision in this commit:"
          uv run alembic heads

      - name: Apply migrations
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: uv run alembic upgrade head

      # Corre en cada push que llegue hasta aquí, y es seguro: seed_defaults() inserta
      # solo las filas por defecto que faltan y no toca nunca una que ya existe, así que
      # una duración editada desde el panel de administración sobrevive a un redespliegue.
      #
      # Va aquí y no en un paso manual porque una base de datos migrada pero nunca
      # sembrada responde a GET /availability con un calendario vacío -- que parece un
      # profesional con la agenda llena, no un despliegue roto.
      - name: Seed default configuration
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: uv run python -m app.seed
