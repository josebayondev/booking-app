# Escaneo de secretos con gitleaks sobre el historial **completo** de git: un secreto que
# llegó a entrar alguna vez sigue tumbando la CI hasta que se purga del historial, no solo
# hasta que se borra en un commit posterior.
name: Secret scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks recorre el historial de git, no solo el árbol de trabajo, así
          # que necesita todos los commits. El clon superficial por defecto solo
          # vería la punta.
          fetch-depth: 0
          persist-credentials: false

      # La CLI de gitleaks es MIT y corre en cualquier sitio. La gitleaks-action
      # oficial no se usa a propósito: exige una clave de licencia de pago para los
      # repositorios que pertenecen a una organización de GitHub, lo que rompería la
      # CI en silencio en cualquier app derivada de esta plantilla que no viva bajo
      # una cuenta personal.
      #
      # Fijada por digest, igual que las imágenes base de backend/Dockerfile. Ojo:
      # Dependabot no sigue los digests de imágenes dentro de los pasos `run` de un
      # workflow, así que este hay que subirlo a mano cuando salga un gitleaks nuevo.
      - name: Scan git history for secrets
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/repo" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-banner --redact --verbose
