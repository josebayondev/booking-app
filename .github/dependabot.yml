# Dependabot: mantiene al día los lockfiles de Python y npm, los digests de las imágenes
# base y los SHA de las actions. Semanal y con margen de espera antes de adoptar una
# release.
version: 2
updates:
  # Dependencias de Python fijadas en backend/uv.lock
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Mover solo uv.lock. Los rangos de pyproject.toml declaran con qué es compatible
    # el proyecto, así que no deberían bailar cada vez que sale un parche.
    versioning-strategy: lockfile-only
    # No adoptar una release el día que sale — deja margen por si la retiran.
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  # Dependencias de npm del frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Aquí sí se mueven los rangos de package.json, al revés que en el bloque de uv. En
    # el backend los rangos de pyproject.toml son el contrato de compatibilidad y el pin
    # real vive en uv.lock; en npm los rangos de package.json son el único pin que
    # declara qué versión se quiere. Con lockfile-only, un major (React 20, Vite 9) no
    # llegaría nunca a proponerse y el frontend se quedaría atrás en silencio.
    versioning-strategy: increase
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  # Digests de las imágenes base en backend/Dockerfile
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # De Python 3.13 a 3.14 es un salto *minor* en semver, así que bloquear solo
      # major no lo cazaría. Mover el runtime es un cambio deliberado:
      # .python-version, requires-python, [tool.mypy], [tool.ruff] y el lockfile
      # tienen que moverse juntos. Aquí solo actualizaciones de parche/digest.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # SHA de las actions en .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
